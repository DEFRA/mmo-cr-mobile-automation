name: Android E2E

on:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: android-e2e-${{ github.ref }}
    cancel-in-progress: true

jobs:
    setup:
        name: Setup Android Environment
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

    test:
        name: Execute Android E2E Tests
        needs: setup
        runs-on: ubuntu-latest
        timeout-minutes: 45
        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Run Android E2E tests
              run: npm run test:android:browserstack
              env:
                  BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
                  BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
                  BROWSERSTACK_ANDROID_APP_URL: ${{ secrets.BROWSERSTACK_ANDROID_APP_URL }}
                  ANDROID_TEST_EMAIL: ${{ secrets.ANDROID_TEST_EMAIL }}
                  ANDROID_TEST_PASSWORD: ${{ secrets.ANDROID_TEST_PASSWORD }}

            - name: Upload Allure results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: android-allure-results
                  path: allure-results/
                  if-no-files-found: ignore

    report:
        name: Generate Android Test Report
        needs: test
        if: always()
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Download Allure results
              uses: actions/download-artifact@v4
              with:
                  name: android-allure-results
                  path: allure-results/

            - name: Generate Allure Report
              run: npm run generate:report
